<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FLAPPYCAT</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Noto Sans CJK SC", "Noto Sans", system-ui, sans-serif;
        background: #193942;
        color: #f6f6ef;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #2d5d68, #11262b 70%);
      }
      .shell {
        width: min(92vw, 760px);
        display: grid;
        gap: 16px;
        justify-items: center;
      }
      .title {
        text-align: center;
      }
      .title h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 48px);
        letter-spacing: 0.08em;
      }
      .title p {
        margin: 8px 0 0;
        color: #d6eef1;
      }
      canvas {
        width: min(92vw, 480px);
        height: auto;
        border-radius: 20px;
        box-shadow: 0 24px 70px rgba(0,0,0,0.35);
        background: #70c5ce;
      }
      .hud {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .pill {
        min-width: 132px;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(8px);
      }
      .pill b {
        display: block;
        font-size: 12px;
        color: #bfe1e5;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .help {
        color: #cfe9ec;
        text-align: center;
        max-width: 560px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="title">
        <h1>FLAPPYCAT</h1>
        <p>Space 起飞，穿过管道，别把猫摔死。</p>
      </header>
      <canvas id="game" width="480" height="640" aria-label="FLAPPYCAT game canvas"></canvas>
      <section class="hud">
        <div class="pill"><b>score</b><span id="score-value">0</span></div>
        <div class="pill"><b>phase</b><span id="phase-value">ready</span></div>
      </section>
      <p class="help">这版故意做成纯前端、纯引擎。渲染层是薄壳，闸门直接读真实状态，不跟 UI 猜拳。</p>
    </main>
    <script type="module" src="./src/main.mjs"></script>
  </body>
</html>
